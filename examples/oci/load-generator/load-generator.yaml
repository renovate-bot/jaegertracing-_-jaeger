apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-generator
  template:
    metadata:
      labels:
        app: trace-generator
    spec:
      containers:
      - name: trace-generator
        image: python:3.15.1@sha256:dc005c4de6908d750269a5ee683da95b4cfb5bf419f69b8e95d98d9e44bb2841
        command:
          - /bin/sh
          - -c
          - |
            pip install --no-cache-dir -r /app/requirements.txt && python /app/generate_traces.py
        volumeMounts:
        - name: script-volume
          mountPath: /app
      restartPolicy: Always
      volumes:
      - name: script-volume
        configMap:
          name: trace-script
