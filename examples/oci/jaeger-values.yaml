global:
  imageRegistry: docker.io
hotrod:
  enabled: true
  image:
    repository: jaegertracing/example-hotrod
    tag: "1.76.0@sha256:a96cc9e45b48a9bf11932fdfe24d5dc5660a89c9daeb854ef6a40c18f4a203b6"
  args:
    - all
  extraArgs:
    - --otel-exporter=otlp
    - --basepath=/hotrod
    - --jaeger-ui=https://demo.jaegertracing.io/jaeger
  livenessProbe:
    path: /hotrod
  readinessProbe:
    path: /hotrod
  extraEnv:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://jaeger-collector:4318
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://jaeger-collector:4318/v1/traces
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: http/protobuf
    - name: OTEL_SERVICE_NAME
      value: hotrod
    - name: OTEL_LOG_LEVEL
      value: debug
