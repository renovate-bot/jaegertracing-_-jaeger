apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
  namespace: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-generator
  template:
    metadata:
      labels:
        app: trace-generator
    spec:
      restartPolicy: Always
      volumes:
      - name: script-volume
        configMap:
          name: trace-script
          items:
          - key: generate_traces.py
            path: generate_traces.py
          - key: requirements.txt
            path: requirements.txt
      containers:
      - name: trace-generator
        image: python:3.15.1-slim@sha256:533b0b2f9b5d46fd097091cf826f27902f1d6c3bca714b6dc74551356aa97a51
        command:
          - /bin/sh
          - -c
          - |
            pip install --no-cache-dir -r /app/requirements.txt && python /app/generate_traces.py
        env:
        - name: TARGET_URL
          value: "http://jaeger-hotrod.jaeger.svc.cluster.local/dispatch"
        - name: SLEEP_SECONDS
          value: "5"
        volumeMounts:
        - name: script-volume
          mountPath: /app
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
            ephemeral-storage: "200Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
            ephemeral-storage: "1Gi"
