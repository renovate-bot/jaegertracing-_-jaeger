services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.61@sha256:97310af8d8f3e39b7836c3061705c77a488a61dc0c1851f8a4f79f8d71a75d76
    container_name: clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DB=jaeger
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./keeper.yaml:/etc/clickhouse-server/config.d/keeper.yaml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
